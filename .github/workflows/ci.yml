name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'docs/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # steward-core may name Canvas only in the files listed in
  # scripts/canvas-allowlist.txt, and the list may only shrink. The Canvas
  # connector (steward/connectors/canvas/) is exempt.
  boundary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Check the connector boundary
      run: python scripts/check_canvas_boundary.py

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steward-core
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Install Ruff
      run: python -m pip install ruff
    - name: Run Ruff
      run: ruff check src/

  test:
    runs-on: ubuntu-latest
    env:
      # FastMCP 4 temporarily bridges MCP SDK v1 camelCase attribute reads.
      # Keep the bridge off in CI so new code must use the v2 snake_case API.
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    defaults:
      run:
        working-directory: steward-core
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[postgres]"
        pip install pytest pytest-asyncio pyyaml respx
    - name: Run the test suite
      run: python -m pytest -q

  # npm ci installs the lock file as written and --ignore-scripts keeps
  # third-party install scripts from running. check:dist asserts the production
  # build has no inline script, no remote URL, no eval and none of the dev-only
  # mock server.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steward-web
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.19.0'
        cache: npm
        cache-dependency-path: steward-web/package-lock.json
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run typecheck
    - name: Test
      run: npm test
    - name: Build
      run: npm run build
    - name: Check the production build
      run: npm run check:dist
