[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-steward"
version = "0.1.0.dev0"
description = "Per-user upstream credential custody, sign-in and tool gating in front of any MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["mcp", "oauth", "credentials", "gateway", "mcphub"]
dependencies = [
    "fastmcp>=4.1.2,<5",
    # 2.2.0 fixes unbounded stateful HTTP sessions. The authorization server
    # tests pin the provider protocol, handlers and models it relies on.
    "mcp>=2.2,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.1,<3",
    "uvicorn>=0.50.0,<1",
    # AES-256-GCM for the sealed credential store and the account cookies.
    "cryptography>=44.0.0,<51",
    "pillow>=13.0.0,<14",
    "sqlalchemy>=2.1.3,<2.2",
    "alembic>=1.19,<2",
    # Access tokens issued by the authorization server are JWTs signed with joserfc.
    "joserfc>=1.7.2,<2",
]

[project.optional-dependencies]
# psycopg[binary] ships wheels that bundle libpq, so no system packages are needed.
postgres = ["psycopg[binary]>=3.3,<4"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0,<3",
    "pyyaml>=6.0",
    "respx>=0.22",
    "psycopg[binary]>=3.3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
asyncio_mode = "auto"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
